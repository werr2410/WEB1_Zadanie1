                <button id="calculate-btn" class="filter-btn" type="button">Vypočítať vzdialenosť</button>
            </div>
        </div>

        <div id="distance-result"></div>

        <div class="saved-points-container">
            <h3>Pridané body</h3>
            <ul id="points-list"></ul>
        </div>
